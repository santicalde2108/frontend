<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/inicioYRegistro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="main-header">
        <nav class="navbar">
            <div class="nav-left">
                <a href="../index.html" class="nav-logo">
                    <img src="../assets/logo-transp.png" alt="Logo ControlAssistant" class="logo">
                </a>
                <h1 class="site-title">ControlAssistant</h1>
            </div>

            <ul class="nav-right">
                <li><a href="../index.html" class="nav-link active">Inicio</a></li>
                <li><a href="nosotros.html" class="nav-link">Nosotros</a></li>
                <li><a href="contacto.html" class="nav-link">Contacto</a></li>
                <li id="itemLogin">
                    <a href="inicioSesion.html" class="nav-link">Iniciar sesión</a>
                </li>

                <li id="saludo" class="nav-link" style="font-weight:600;"></li>

                <li id="itemLogout" style="display:none;">
                    <a href="#" class="nav-link" id="logoutBtn">Cerrar sesión</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">

        <div class="content">
            <h2 class="text">¡Bienvenido a</h2>
            <h2 class="text">ControlAssistant!</h2>
            <h2 id="saludoUsuario"></h2>
        </div>

        <form class="formulario" id="loginForm">

            <h3>Iniciar Sesión</h3>

            <div class="input-box">
                <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
            </div>

            <div class="input-box" style="position: relative;">
                <input type="password" id="loginPassword" placeholder="Contraseña" required>

            </div>

            <div class="input-box">
                <select id="loginRole" required>
                    <option value="estudiante">Estudiante</option>
                    <option value="profesor">Profesor</option>
                </select>
            </div>

            <button type="submit" class="btn">Iniciar Sesión</button>

            <p class="texto">
                ¿No tienes una cuenta?
                <a href="registro.html">Crea una aquí</a>
            </p>

        </form>

    </main>

    <script src="../js/auth.js"></script>

    <script>
        function togglePassword(id, icon) {
            const input = document.getElementById(id);

            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
    </script>

</body>

</html>
