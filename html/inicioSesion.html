<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link rel="icon" href="../imagenes/logo-transp.png" type="image/png" />
    <link rel="stylesheet" href="../css/inicioYRegistro.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>

<body>

<header class="main-header">
    <nav class="navbar">

        <div class="nav-left">
            <a href="../index.html" class="nav-logo">
                <img src="../imagenes/logo-transp.png" class="logo">
            </a>
            <h1 class="site-title">ControlAssistant</h1>
        </div>

        <ul class="nav-right">
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="contacto.html">Contacto</a></li>

            <li id="itemLogin">
                <a href="inicioSesion.html" class="active">Iniciar sesión</a>
            </li>

            <li id="itemLogout" style="display:none;">
                <a href="#" id="logoutBtn">Cerrar sesión</a>
            </li>
        </ul>

    </nav>
</header>

<main class="container">

    <div class="content">
        <h2>¡Bienvenido a ControlAssistant!</h2>
        <h2 id="saludoUsuario"></h2>
    </div>

    <form id="loginForm" class="formulario">

        <h3>Iniciar Sesión</h3>

        <div class="input-box">
            <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
        </div>

        <div class="input-box">
            <input type="password" id="loginPassword" placeholder="Contraseña" required>
        </div>

        <div class="input-box">
            <select id="loginRole" required>
                <option value="estudiante">Estudiante</option>
                <option value="profesor">Profesor</option>
            </select>
        </div>

        <button type="submit" class="btn">Iniciar Sesión</button>

        <p class="texto">
            ¿No tienes cuenta?
            <a href="registro.html">Crear cuenta</a>
        </p>

    </form>

</main>

<script src="../js/auth.js"></script>

</body>
</html>
